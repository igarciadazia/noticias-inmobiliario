name: Resumen inmobiliario diario

on:
  schedule:
    # GitHub programa siempre en UTC. Se lanza a las dos horas posibles y el
    # propio script descarta la que no sean las 8:00 en Madrid.
    - cron: "0 6 * * *"   # 8:00 en Madrid con horario de verano
    - cron: "0 7 * * *"   # 8:00 en Madrid con horario de invierno
  workflow_dispatch:      # permite lanzarlo a mano desde la web

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enviar el resumen
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        # En las ejecuciones programadas se comprueba la hora de Madrid.
        # Si se lanza a mano, se envia siempre (para poder probarlo).
        run: python noticias.py ${{ github.event_name == 'schedule' && '--solo-a-las-8' || '' }}
