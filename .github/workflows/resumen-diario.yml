name: Resumen inmobiliario diario

on:
  schedule:
    - cron: "35 4 * * *"
    - cron: "35 5 * * *"
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enviar el resumen
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python noticias.py ${{ github.event_name == 'schedule' && '--solo-a-las-8' || '' }}
