name: Alquileres La Fortuna y Los Angeles

on:
  schedule:
    # ---------------------------------------------------------------------
    # CUATRO intentos cada miercoles y sabado (el "3,6" del final), no uno.
    #
    # GitHub NO garantiza las tareas programadas: las mete en una cola comun y,
    # cuando hay atasco, las DESCARTA. No las retrasa para luego: las pierde, sin
    # aviso, sin email y sin dejar ni una linea en la pestana Actions.
    #
    # Con un solo disparo al dia eso son 3 o 4 dias sin email y en silencio. Con
    # varios, el primero que consiga ejecutarse manda el correo y deja escrita la
    # marca "ya enviado hoy" en estado_alquileres.json; los siguientes la leen y
    # se retiran solos. Solo se pierde el envio si fallan los cuatro.
    #
    # Los minutos son "raros" a proposito: casi todo el mundo programa en punto o
    # a y media, y esos picos son justo los que provocan los descartes.
    #
    # No hace falta emparejar crons para el cambio de hora: el script no mira que
    # cron le desperto, sino el reloj de Madrid (VENTANA_ENVIO, 07:40-14:00).
    # ---------------------------------------------------------------------
    - cron: "48 5 * * 3,6"   # verano 7:48 · invierno 6:48 (aun pronto, se retira)
    - cron: "48 6 * * 3,6"   # verano 8:48 · invierno 7:48
    - cron: "17 8 * * 3,6"   # verano 10:17 · invierno 9:17
    - cron: "36 11 * * 3,6"  # verano 13:36 · invierno 12:36
  workflow_dispatch:         # a mano: envia siempre, sin mirar dia ni hora

# Necesario para poder guardar en el repositorio que anuncios se han enviado ya
# y que dia se envio por ultima vez.
permissions:
  contents: write

# Dos intentos no deben solaparse nunca: si uno va lento, el siguiente espera a
# que termine y asi encuentra la marca de "ya enviado" bien escrita.
concurrency:
  group: alquileres
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar el navegador
        # idealista esta protegido por DataDome y rechaza cualquier cliente que no
        # sea un navegador de verdad. "chrome" instala el Google Chrome autentico,
        # que es el que mejor pasa el filtro; chromium queda de suplente.
        # --with-deps trae ademas las librerias del sistema que necesita.
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chrome
          python -m playwright install --with-deps chromium
          # xvfb suele venir de serie en el runner, pero no esta garantizado y sin
          # el no se puede abrir el navegador "con ventana".
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Enviar el email de alquileres
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Solo por si algun dia hiciera falta un servicio de scraping de pago.
          # Si no existen, llegan vacias y el script ni las mira.
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          ZENROWS_KEY: ${{ secrets.ZENROWS_KEY }}
          SCRAPERAPI_NIVEL: ${{ secrets.SCRAPERAPI_NIVEL }}
        # xvfb-run da una pantalla virtual: sin ella no se puede abrir el navegador
        # en modo "con ventana", que es una de las configuraciones que prueba.
        #
        # En las ejecuciones programadas se comprueban dia, hora de Madrid y si el
        # email de hoy ya salio. Si se lanza a mano, se envia siempre.
        run: >
          xvfb-run -a
          python alquileres.py
          ${{ github.event_name == 'schedule' && '--solo-por-la-manana' || '' }}

      - name: Recordar que ya se ha enviado
        # Esto es lo que impide que los intentos posteriores repitan el email, asi
        # que importa que salga bien. Aun asi no debe tumbar la ejecucion: el email
        # ya se ha enviado y lo peor que puede pasar es un correo repetido.
        continue-on-error: true
        run: |
          if [ ! -f estado_alquileres.json ]; then
            echo "No hay estado que guardar (esta ejecucion no envio nada)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado_alquileres.json
          if git diff --staged --quiet; then
            echo "Sin cambios en el estado."
          else
            git commit -m "Envio del $(date +%F)"
            # Por si otra ejecucion hubiera escrito en medio.
            git pull --rebase --autostash || true
            git push
          fi
